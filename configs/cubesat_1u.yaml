# Power model of a generic 1U CubeSat flying FUNcube-1's orbit.
# The spacecraft values are representative assumptions for a 1U CubeSat,
# not FUNcube-1 datasheet values.

satellite:
  tle_file: data/tle/funcube1.tle

simulation:
  start: "2026-11-21T00:00:00"
  duration_days: 7
  step_s: 30
  eclipse_model: skyfield      # skyfield | cylindrical

solar_array:
  cell_efficiency: 0.28        # triple-junction GaAs cells
  faces:                       # body-mounted panels: area of cells per face
    +X: 0.0060                 # m^2 (two 30 cm^2 cells per face)
    -X: 0.0060
    +Y: 0.0060
    -Y: 0.0060
    +Z: 0.0060
    -Z: 0.0060
  attitude: tumbling           # tumbling | sun_pointing

battery:
  capacity_wh: 19.2            # two 18650 Li-ion cells, 9.6 Wh each
  initial_soc: 0.8
  charge_efficiency: 0.90
  discharge_efficiency: 0.95

loads:                         # average power per subsystem [W]
  obc: 0.4                     # on-board computer
  eps: 0.2                     # power system electronics
  adcs: 0.3                    # attitude sensors
  radio_rx: 0.3
  radio_tx: 1.0                # transmitter, used duty_cycle of the time
  radio_tx_duty_cycle: 0.5

# Delay/disruption tolerant networking (store-and-forward) model.
# When enabled, the transmitter is no longer on for a fixed duty cycle: it is
# on only while a ground station is in view and there are bundles to send,
# and radio_tx_duty_cycle above is ignored.
dtn:
  enabled: false
  ground_stations: configs/ground_stations.yaml
  min_elevation_deg: 10
  downlink_bps: 9600           # UHF GMSK, a common 1U CubeSat downlink
  uplink_bps: 1200
  link_efficiency: 0.7         # framing, coding and retransmissions
  housekeeping_bps: 16         # telemetry, generated all the time
  payload_bps: 512             # science data, not generated in safe mode
  bundle_bytes: 4096           # application data units are packed in bundles of this size
  bundle_lifetime_h: 48        # a bundle not delivered within its lifetime is discarded
  storage_bytes: 4000000       # on-board bundle storage
  policy: energy_aware         # energy_aware | always
  tx_min_soc: 0.5              # energy_aware: no downlink below this state of charge
